<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        padding: 50px;
      }
      .wrap {
        display: flex;
      }
      .title {
        width: 100px;
      }
      ul {
        display: flex;
      }
      li {
        list-style: none;
        width: 50px;
        height: 50px;
        line-height: 50px;
        margin-right: 10px;
        border: 1px solid #000;
        text-align: center;
      }
      .point {
        padding: 10px;
      }
    </style>
    <title>Build Tree</title>
  </head>
  <body>
    <div id="cur"></div>
    
    <div class="wrap">
      <h3 class="title">preorder</h3>
      <ul id="preorderBox"></ul>
    </div>

    <div class="point" id="p">p: -</div>
    <div class="point" id="s">s: -</div>
    <div class="point" id="i">i: -</div>

    <div class="wrap">
      <h3 class="title">inorder</h3>
      <ul id="inorderBox"></ul>
    </div>

    <script type="module" src="./index.mjs"></script>
  </body>
</html>
